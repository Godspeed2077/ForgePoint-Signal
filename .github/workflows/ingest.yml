name: Ingest Federal Register

on:
  schedule:
    # 13:15 UTC daily (~08:15 ET, after the Federal Register's morning post).
    # Off-round time reduces the chance of GitHub cron delays.
    - cron: "15 13 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "How many days back to scan (overrides default of 30)"
        required: false
        default: "30"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npm run ingest
        env:
          FORGEPOINT_API_URL: ${{ secrets.FORGEPOINT_API_URL }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '' }}
